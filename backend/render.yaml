services:
  - type: web
    name: rentease-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn rentease_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: rentease-backend.onrender.com,localhost